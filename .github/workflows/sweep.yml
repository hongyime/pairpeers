name: Hourly match sweep

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret length
        run: |
          len=$(printf "%s" "${{ secrets.PAIRPEERS_CRON_SECRET }}" | wc -c)
          echo "secret length: $len"
      - name: Trigger match sweep
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.PAIRPEERS_CRON_SECRET }}" \
            "https://pairpeers.hong-yi.me/api/admin/match/run?action=sweep")
          echo "sweep status: $code"
          [ "$code" = "200" ]
